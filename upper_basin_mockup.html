<!DOCTYPE html>
<html>
<head>
    <title>Upper Colorado Basin Mockup</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { padding: 0; margin: 0; }
        #map { height: 100vh; width: 100vw; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // Initialize map centered on the Upper Basin
        var map = L.map('map').setView([39.0, -109.5], 6);

        // Add OpenTopoMap (Shaded Relief Terrain)
        L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            maxZoom: 17,
            attribution: 'Map data: &copy; OpenStreetMap contributors, SRTM | Map style: &copy; OpenTopoMap'
        }).addTo(map);

        // Our 4 Sentinel Streamflow Gauges (Blue)
        var stations = [
            {name: "Colorado River near Dotsero, CO<br><i>Captures high-country runoff</i>", lat: 39.6433, lon: -107.0375},
            {name: "Colorado River near Cameo, CO<br><i>Just above Grand Valley diversions</i>", lat: 39.1949, lon: -108.3184},
            {name: "Colorado River near Cisco, UT<br><i>Captures almost all CO state outflow</i>", lat: 38.8105, lon: -109.3006},
        ];
        
        stations.forEach(function(s) {
            L.circleMarker([s.lat, s.lon], {radius: 8, color: 'blue', fillColor: '#3388ff', fillOpacity: 0.8})
             .bindPopup("<b>" + s.name + "</b>")
             .addTo(map);
        });

        // Lees Ferry (The Legal Dividing Line - Red)
        L.circleMarker([36.8655, -111.5866], {radius: 10, color: 'red', fillColor: '#ff3333', fillOpacity: 0.9})
         .bindPopup("<b>Colorado River at Lees Ferry, AZ</b><br><i>The 1922 Compact dividing line between Upper and Lower Basin.</i>")
         .addTo(map);

        // Major Tributaries (Purple)
        var confluences = [
            {name: "Confluence: Gunnison River", lat: 39.0583, lon: -108.5723},
            {name: "Confluence: Green River<br><i>Green River is often larger than the Colorado here!</i>", lat: 38.1888, lon: -109.8055},
            {name: "Confluence: San Juan River", lat: 37.1783, lon: -110.8683}
        ];
        confluences.forEach(function(c) {
            L.circleMarker([c.lat, c.lon], {radius: 6, color: 'purple', fillOpacity: 0.6})
             .bindPopup("<b>" + c.name + "</b>")
             .addTo(map);
        });

        // Glenwood Canyon / Shoshone Power Plant (Green)
        L.circleMarker([39.5735, -107.2217], {radius: 7, color: 'green', fillOpacity: 0.8})
         .bindPopup("<b>Shoshone Power Plant (Glenwood Canyon)</b><br><i>Senior 1902 water right. Non-consumptive, but forces water to stay in the river, preventing Denver from taking it upstream!</i>")
         .addTo(map);

    </script>
</body>
</html>
